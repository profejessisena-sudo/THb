<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biblioteca de Talento Humano</title>
<!--
  ================================================================
  BIBLIOTECA DE TALENTO HUMANO · Plantilla lista para usar
  ================================================================
  Usted solo edita la parte marcada "DATOS DE SU BIBLIOTECA",
  casi al final de este archivo.

  Para cada documento pegue su enlace en  enlace: "..."
  Sirven tres tipos de enlace:
   1. Google Drive o Google Docs, compartido como
      "Cualquier persona con el enlace · Lector".
   2. Un PDF subido a GitHub junto a este archivo:  enlace: "TH-FR-01.pdf"
   3. Un Word subido a GitHub junto a este archivo: enlace: "TH-FR-01.docx"
      (el Word se ve solo cuando la página ya está publicada en internet).
  Si deja el enlace vacío (""), el documento aparece como "Pendiente".
  ================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a wooden shelf of process "books" up top; the chosen book opens a drawer of catalog index cards below; each card opens a reading-room viewer. */
:root{
  --paper:#ECEFE9; --surface:#FAFBF8; --ink:#1C2622; --muted:#56635D; --line:#D2D8D0;
  --accent:#1F5F4A; --accent-ink:#FAFBF8; --wood:#7A4E33; --wood-edge:#553321; --wall:#E2E6DE;
  --pending:#8A6A1E; --pending-bg:#F6EDD3; --ok:#1F5F4A; --ok-bg:#DCEDE4;
  --shadow:0 1px 2px rgba(28,38,34,.08),0 6px 18px rgba(28,38,34,.08);
  --f-display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --f-body:"Figtree","Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono","Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#131816; --surface:#1B221F; --ink:#E5EBE7; --muted:#9BA8A2; --line:#2E3833;
  --accent:#6FC3A0; --accent-ink:#0F1513; --wood:#5B3A27; --wood-edge:#3B2518; --wall:#181F1C;
  --pending:#E3C46E; --pending-bg:#3A3220; --ok:#7FD0AE; --ok-bg:#1E3A2F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131816; --surface:#1B221F; --ink:#E5EBE7; --muted:#9BA8A2; --line:#2E3833;
  --accent:#6FC3A0; --accent-ink:#0F1513; --wood:#5B3A27; --wood-edge:#3B2518; --wall:#181F1C;
  --pending:#E3C46E; --pending-bg:#3A3220; --ok:#7FD0AE; --ok-bg:#1E3A2F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-body)}
.wrap{max-width:1180px;margin:0 auto;padding-block:32px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:32px}

/* Encabezado */
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px}
.brand{min-width:0;display:flex;flex-direction:column;gap:6px}
.eyebrow{font:600 12px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{margin:0;font:800 clamp(32px,5vw,52px)/1.05 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.sub{margin:0;color:var(--muted);max-width:60ch}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 16px;width:min(340px,100%)}
.search input{border:0;outline:0;background:transparent;color:var(--ink);font:500 15px var(--f-body);width:100%}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.search svg{flex:none;color:var(--muted)}

/* Estantería */
.shelf{background:var(--wall);border:1px solid var(--line);border-radius:18px;padding:28px 20px 0;overflow:hidden}
.shelf-label{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:600 13px var(--f-body);color:var(--muted);margin-bottom:18px}
.books{display:flex;align-items:flex-end;gap:10px;overflow-x:auto;padding:30px 4px 0;scrollbar-width:thin}
.books>:first-child{margin-left:auto}.books>:last-child{margin-right:auto}
.book{flex:none;position:relative;width:78px;border:0;border-radius:6px 6px 2px 2px;cursor:pointer;color:#fff;
  background:var(--c);padding:14px 0 12px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:inset 6px 0 0 rgba(255,255,255,.14),inset -4px 0 0 rgba(0,0,0,.18),0 2px 0 rgba(0,0,0,.15);
  transition:transform .25s ease,box-shadow .25s ease;font-family:var(--f-body)}
.book.dark-text{color:#231A06}
.book::before,.book::after{content:"";position:absolute;left:0;right:0;height:3px;background:rgba(255,255,255,.28)}
.book::before{top:26px}.book::after{bottom:44px}
.book:hover{transform:translateY(-10px)}
.book[aria-pressed="true"]{transform:translateY(-18px);box-shadow:inset 6px 0 0 rgba(255,255,255,.14),inset -4px 0 0 rgba(0,0,0,.18),0 0 0 3px var(--paper),0 0 0 6px var(--c)}
.book:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.book .title{writing-mode:vertical-rl;transform:rotate(180deg);font:700 19px/1 var(--f-display);letter-spacing:.01em;white-space:nowrap}
.book .count{font:500 12px var(--f-mono);background:rgba(0,0,0,.22);border-radius:999px;padding:2px 8px}
.book.dark-text .count{background:rgba(255,255,255,.4)}
.plank{height:22px;margin:0 -20px;background:linear-gradient(var(--wood),var(--wood-edge));border-top:3px solid color-mix(in srgb,var(--wood) 70%,#fff)}

/* Cajón de fichas */
.drawer{display:flex;flex-direction:column;gap:20px}
.drawer-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.drawer-head h2{margin:0;font:700 clamp(26px,3.4vw,34px)/1.1 var(--f-display);display:flex;align-items:center;gap:12px}
.dot{width:16px;height:16px;border-radius:4px;background:var(--c);flex:none}
.drawer-head p{margin:0;color:var(--muted);max-width:62ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 18px 16px;cursor:pointer;
  color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:10px;min-width:0;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s}
.card::before{content:"";position:absolute;top:0;left:18px;right:18px;height:4px;background:var(--c);border-radius:0 0 4px 4px}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.code{font:500 13px var(--f-mono);color:var(--muted)}
.pill{font:600 12px var(--f-body);padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.pend{background:var(--pending-bg);color:var(--pending)}
.card h3{margin:0;font:700 19px/1.25 var(--f-display);overflow-wrap:anywhere}
.card .meta{border-top:1px dashed var(--line);padding-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-top:auto}
.card .meta .open{font-weight:600;color:var(--accent)}
.empty{grid-column:1/-1;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px;color:var(--muted);text-align:center}

footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:14px}

/* Visor */
dialog{border:0;padding:0;border-radius:16px;background:var(--surface);color:var(--ink);width:min(1000px,calc(100vw - 32px));height:min(88vh,900px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(12,18,15,.6)}
.viewer{display:flex;flex-direction:column;height:100%}
.viewer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.viewer-head .t{min-width:0;display:flex;flex-direction:column;gap:2px}
.viewer-head h3{margin:0;font:700 20px/1.2 var(--f-display);overflow-wrap:anywhere}
.actions{display:flex;gap:8px}
.btn{font:600 14px var(--f-body);border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.frame{flex:1;min-height:0;background:var(--paper)}
.frame iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.placeholder{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;color:var(--muted)}
.placeholder b{color:var(--ink);font:700 20px var(--f-display)}
.placeholder code{font:500 13px var(--f-mono);background:var(--surface);border:1px solid var(--line);padding:6px 10px;border-radius:6px;color:var(--ink);overflow-wrap:anywhere}

@media (max-width:560px){.book{width:62px}.book .title{font-size:16px}.cards{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <span class="eyebrow" id="eyebrow"></span>
      <h1 id="titulo"></h1>
      <p class="sub" id="descripcion"></p>
    </div>
    <label class="search" for="q">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar documento o código…" autocomplete="off" aria-label="Buscar documento o código">
    </label>
  </header>

  <section class="shelf" aria-label="Procesos de Talento Humano">
    <div class="shelf-label"><span>Escoja un proceso</span><span id="totales"></span></div>
    <div class="books" id="books"></div>
    <div class="plank"></div>
  </section>

  <section class="drawer" id="drawer" aria-live="polite"></section>

  <footer><span id="autores"></span><span id="pie"></span></footer>
</div>

<dialog id="visor" aria-labelledby="v-titulo">
  <div class="viewer">
    <div class="viewer-head">
      <div class="t"><span class="code" id="v-codigo"></span><h3 id="v-titulo"></h3></div>
      <div class="actions">
        <a class="btn" id="v-abrir" target="_blank" rel="noopener">Abrir en pestaña nueva</a>
        <button class="btn primary" id="v-cerrar" type="button">Cerrar</button>
      </div>
    </div>
    <div class="frame" id="v-frame"></div>
  </div>
</dialog>

<script>
/* =============================================================
   DATOS DE SU BIBLIOTECA  ·  Edite solo esta parte
   ============================================================= */
const BIBLIOTECA = {
  empresa: "Empresa Ficticia S.A.S.",
  titulo: "Biblioteca de Talento Humano",
  descripcion: "Formatos y documentos de cada proceso de gestión humana. Escoja un libro de la estantería para ver sus documentos.",
  autores: "Elaborado por: [Nombre del aprendiz] · Ficha [número]",

  procesos: [
    { nombre: "Selección", color: "#2E5E8C",
      descripcion: "Desde la necesidad de la vacante hasta escoger al candidato.",
      documentos: [
        { codigo: "TH-FR-01", nombre: "Requisición de personal", tipo: "Formato", enlace: "" },
        { codigo: "TH-FR-02", nombre: "Perfil y descripción de cargo", tipo: "Formato", enlace: "" },
        { codigo: "TH-MD-01", nombre: "Convocatoria", tipo: "Documento", enlace: "" },
        { codigo: "TH-FR-03", nombre: "Hoja de vida estandarizada", tipo: "Formato", enlace: "" },
        { codigo: "TH-FR-04", nombre: "Guía de entrevista estructurada", tipo: "Formato", enlace: "" },
        { codigo: "TH-FR-05", nombre: "Verificación de referencias", tipo: "Formato", enlace: "" }
      ] },
    { nombre: "Contratación", color: "#B5562E",
      descripcion: "Documentos para vincular formalmente al trabajador.",
      documentos: [
        { codigo: "TH-FR-06", nombre: "Remisión a exámenes médicos", tipo: "Formato", enlace: "" },
        { codigo: "TH-FR-07", nombre: "Lista de chequeo de documentos", tipo: "Formato", enlace: "" },
        { codigo: "TH-MD-02", nombre: "Contrato de trabajo", tipo: "Documento", enlace: "" }
      ] },
    { nombre: "Inducción", color: "#3F7A55",
      descripcion: "Bienvenida y entrenamiento del nuevo trabajador.",
      documentos: [
        { codigo: "TH-MD-03", nombre: "Programa de inducción", tipo: "Documento", enlace: "" },
        { codigo: "TH-FR-08", nombre: "Lista de chequeo de inducción", tipo: "Formato", enlace: "" },
        { codigo: "TH-FR-09", nombre: "Encuesta de satisfacción de la inducción", tipo: "Formato", enlace: "" }
      ] },
    { nombre: "Capacitación", color: "#C8962E",
      descripcion: "Plan de formación y control de asistencia.",
      documentos: [
        { codigo: "TH-FR-10", nombre: "Plan anual de capacitación", tipo: "Formato", enlace: "" },
        { codigo: "TH-FR-11", nombre: "Control de asistencia", tipo: "Formato", enlace: "" }
      ] },
    { nombre: "Desempeño", color: "#7B4B8E",
      descripcion: "Evaluación de resultados y planes de mejora.",
      documentos: [
        { codigo: "TH-FR-12", nombre: "Evaluación del desempeño", tipo: "Formato", enlace: "" },
        { codigo: "TH-FR-13", nombre: "Plan de mejoramiento individual", tipo: "Formato", enlace: "" }
      ] },
    { nombre: "Bienestar", color: "#2F6F73",
      descripcion: "Actividades de bienestar y clima laboral.",
      documentos: [
        { codigo: "TH-MD-04", nombre: "Plan de bienestar laboral", tipo: "Documento", enlace: "" }
      ] },
    { nombre: "Retiro", color: "#8C3B4A",
      descripcion: "Cierre de la relación laboral.",
      documentos: [
        { codigo: "TH-MD-05", nombre: "Carta de terminación de contrato", tipo: "Documento", enlace: "" },
        { codigo: "TH-FR-14", nombre: "Paz y salvo", tipo: "Formato", enlace: "" },
        { codigo: "TH-FR-15", nombre: "Entrevista de retiro", tipo: "Formato", enlace: "" }
      ] }
  ]
};
/* =============================================================
   FIN DE LOS DATOS · No necesita cambiar nada de aquí hacia abajo
   ============================================================= */

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P = BIBLIOTECA.procesos;
let actual = 0, busqueda = "";

// Colores claros usan texto oscuro en el lomo
function claro(hex){const h=hex.replace("#","");const n=parseInt(h.length===3?h.split("").map(x=>x+x).join(""):h,16);
  const r=(n>>16)&255,g=(n>>8)&255,b=n&255;return (0.299*r+0.587*g+0.114*b)>165}

// Convierte el enlace en una vista previa
function vista(url){
  url = (url||"").trim(); if(!url) return null;
  let m = url.match(/drive\.google\.com\/file\/d\/([^/?#]+)/) || url.match(/drive\.google\.com\/open\?id=([^&#]+)/);
  if(m) return {src:`https://drive.google.com/file/d/${m[1]}/preview`, open:url};
  m = url.match(/docs\.google\.com\/(document|spreadsheets|presentation)\/d\/([^/?#]+)/);
  if(m) return {src:`https://docs.google.com/${m[1]}/d/${m[2]}/preview`, open:url};
  let abs; try{abs=new URL(url,location.href).href}catch(e){abs=url}
  if(/\.(docx?|xlsx?|pptx?)(\?|#|$)/i.test(url))
    return {src:`https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(abs)}`, open:abs, office:true};
  return {src:abs, open:abs};
}

function lomo(p,i){
  const n=p.documentos.length, alto=220+((p.nombre.length*7+i*23)%70);
  return `<button class="book${claro(p.color)?" dark-text":""}" style="--c:${esc(p.color)};height:${alto}px" data-i="${i}" aria-pressed="${!busqueda&&i===actual}" aria-label="${esc(p.nombre)}, ${n} documentos">
    <span class="count">${n}</span><span class="title">${esc(p.nombre)}</span><span></span></button>`;
}

function ficha(d,p){
  const listo=!!(d.enlace||"").trim();
  return `<button class="card" style="--c:${esc(p.color)}" data-p="${P.indexOf(p)}" data-d="${p.documentos.indexOf(d)}">
    <div class="top"><span class="code">${esc(d.codigo)}</span><span class="pill ${listo?"ok":"pend"}">${listo?"Disponible":"Pendiente"}</span></div>
    <h3>${esc(d.nombre)}</h3>
    <div class="meta"><span>${esc(d.tipo||"Documento")}${busqueda?" · "+esc(p.nombre):""}</span><span class="open">Ver →</span></div>
  </button>`;
}

function pintar(){
  $("books").innerHTML = P.map(lomo).join("");
  const drawer=$("drawer");
  if(busqueda){
    const q=busqueda.toLowerCase(), res=[];
    P.forEach(p=>p.documentos.forEach(d=>{ if((d.nombre+" "+d.codigo+" "+p.nombre).toLowerCase().includes(q)) res.push(ficha(d,p)) }));
    drawer.innerHTML=`<div class="drawer-head"><h2>Resultados de “${esc(busqueda)}”</h2><p>${res.length} documento${res.length===1?"":"s"}</p></div>
      <div class="cards">${res.join("")||'<div class="empty">No hay documentos con ese nombre o código.</div>'}</div>`;
  } else {
    const p=P[actual]; if(!p){drawer.innerHTML="";return}
    drawer.innerHTML=`<div class="drawer-head" style="--c:${esc(p.color)}"><h2><span class="dot"></span>${esc(p.nombre)}</h2><p>${esc(p.descripcion||"")}</p></div>
      <div class="cards">${p.documentos.map(d=>ficha(d,p)).join("")||'<div class="empty">Este proceso todavía no tiene documentos.</div>'}</div>`;
  }
}

function abrir(p,d){
  const doc=P[p].documentos[d], v=vista(doc.enlace);
  $("v-codigo").textContent=`${doc.codigo} · ${P[p].nombre}`;
  $("v-titulo").textContent=doc.nombre;
  const a=$("v-abrir");
  if(v){ a.href=v.open; a.hidden=false;
    $("v-frame").innerHTML=`<iframe src="${esc(v.src)}" title="${esc(doc.nombre)}" loading="lazy" allow="autoplay"></iframe>`;
  } else { a.hidden=true; a.removeAttribute("href");
    $("v-frame").innerHTML=`<div class="placeholder"><b>Documento pendiente</b><span>Pegue el enlace del documento en el archivo, en la línea:</span><code>{ codigo: "${esc(doc.codigo)}", … enlace: "aquí" }</code></div>`;
  }
  const dlg=$("visor"); if(dlg.showModal) dlg.showModal(); else dlg.setAttribute("open","");
}
function cerrar(){const dlg=$("visor"); dlg.close?dlg.close():dlg.removeAttribute("open"); $("v-frame").innerHTML=""}

$("books").addEventListener("click",e=>{const b=e.target.closest(".book"); if(!b) return;
  actual=+b.dataset.i; busqueda=""; $("q").value=""; pintar();
  $("drawer").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})});
$("drawer").addEventListener("click",e=>{const c=e.target.closest(".card"); if(c) abrir(+c.dataset.p,+c.dataset.d)});
$("q").addEventListener("input",e=>{busqueda=e.target.value.trim(); pintar()});
$("v-cerrar").addEventListener("click",cerrar);
$("visor").addEventListener("close",()=>{$("v-frame").innerHTML=""});
$("visor").addEventListener("click",e=>{if(e.target===$("visor")) cerrar()});

// Textos generales
const total=P.reduce((s,p)=>s+p.documentos.length,0), listos=P.reduce((s,p)=>s+p.documentos.filter(d=>(d.enlace||"").trim()).length,0);
$("eyebrow").textContent=BIBLIOTECA.empresa;
$("titulo").textContent=BIBLIOTECA.titulo;
$("descripcion").textContent=BIBLIOTECA.descripcion;
$("totales").textContent=`${P.length} procesos · ${total} documentos · ${listos} disponibles`;
$("autores").textContent=BIBLIOTECA.autores;
$("pie").textContent="Datos ficticios con fines de formación";
document.title=BIBLIOTECA.titulo;
pintar();
</script>
</body>
</html>
